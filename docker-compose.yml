version: '3.8'

services:
  # Сервис обучения модели
  train:
    build: .
    container_name: news-title-trainer
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: python scripts/train.py
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Сервис веб-приложения
  web:
    build: .
    container_name: news-title-web
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: uvicorn scripts.web_app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on:
      - train
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Сервис инференса (интерактивный)
  inference:
    build: .
    container_name: news-title-inference
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: python scripts/inference.py --interactive
    stdin_open: true
    tty: true
    restart: "no"
    depends_on:
      - train
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Сервис визуализации
  visualize:
    build: .
    container_name: news-title-visualize
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: python scripts/visualize_results.py
    restart: "no"
    depends_on:
      - train
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  data:
    driver: local
  results:
    driver: local
  logs:
    driver: local